name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Executer les tests
        run: python -m unittest discover -s tests -v

      - name: Construire l'executable
        run: pyinstaller --noconfirm --clean XboxImageBrowser.spec

      - name: Ajouter l'image de demonstration
        run: Copy-Item demo\demo.iso dist\demo.iso

      - name: Publier l'artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XboxImageBrowser-windows
          path: |
            dist/XboxImageBrowser.exe
            dist/demo.iso
          if-no-files-found: error
