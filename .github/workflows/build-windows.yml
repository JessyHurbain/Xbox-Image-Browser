name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Executer les tests
        run: python -m unittest discover -s tests -v

      - name: Construire l'executable
        run: pyinstaller --noconfirm --clean XboxImageBrowser.spec

      - name: Ajouter l'image de demonstration
        run: Copy-Item demo\demo.iso dist\demo.iso

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: XboxImageBrowser-windows
          path: |
            dist/XboxImageBrowser.exe
            dist/demo.iso
          if-no-files-found: error
